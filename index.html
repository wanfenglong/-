<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>简易贪吃蛇</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <h1>贪吃蛇</h1>
        <p class="subtitle">使用方向键或 WASD 控制，吃到食物让自己变长。</p>
      </div>
      <div class="scoreboard">
        <div class="score">得分：<span id="score">0</span></div>
        <div id="status" class="status">点击“开始游戏”开始</div>
        <button id="start" class="primary">开始游戏</button>
      </div>
    </header>

    <section class="board">
      <canvas id="game" width="420" height="420" aria-label="游戏画布"></canvas>
      <ul class="help">
        <li>方向键 / WASD 控制移动。</li>
        <li>撞墙或撞到自己即失败，点击按钮重新开始。</li>
      </ul>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
